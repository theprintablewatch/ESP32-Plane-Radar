; Two build targets share this file:
;   env:supermini    - ESP32-C3 Super Mini + 1.28" round GC9A01 (240x240, SPI)
;   env:waveshare43b - Waveshare ESP32-S3-Touch-LCD-4.3B (800x480 RGB, GT911 touch)
;
; Flash:  pio run -e supermini    -t upload
;         pio run -e waveshare43b -t upload

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; --- ESP32-C3 Super Mini + 1.28" round GC9A01 (240x240) ---
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"
[env:supermini]
board = esp32-s3-devkitm-1

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

; --- Waveshare ESP32-S3-Touch-LCD-4.3B (ESP32-S3-WROOM-1 N16R8) ---
; 800x480 RGB-parallel LCD, GT911 capacitive touch, CH422G IO expander.
; PSRAM is required: RGB framebuffer (~768KB) + background sprite (~768KB).
[env:waveshare43b]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi   ; 16MB flash QIO + 8MB octal PSRAM
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Larger 28px VLW master so text is crisp at 800x480 (regenerate with
; scripts/gen_vlw.py). Overrides the 15px font in the [env] base.
board_build.embed_files = data/ui_font_43b.vlw
build_flags =
  -DBOARD_WAVESHARE_43B
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
